<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Erlaubte Quellen: nur eigene Dateien (kein eingebetteter Code) und das eigene Supabase-Projekt.
     data: für den QR-Code der Zwei-Faktor-Einrichtung, blob: für die Bildvorschau beim Verkleinern,
     Wikipedia/Wikimedia für die Übernahme von Bildern. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://pkiaxvsgplohhvewbgmw.supabase.co; connect-src https://pkiaxvsgplohhvewbgmw.supabase.co wss://pkiaxvsgplohhvewbgmw.supabase.co https://en.wikipedia.org https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org; base-uri 'none'; form-action 'none'">
<title>Verwaltung – Natur und Schweiz</title>
<link rel="icon" href="icons/steinbock.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/basis.css">
<link rel="stylesheet" href="css/admin.css">
<script src="config.js"></script>
<!-- supabase-js liegt im Repo (js/lib). Aktualisieren: neue Datei von jsDelivr herunterladen und den Dateinamen hier anpassen. -->
<script src="js/lib/supabase-2.117.1.min.js" defer></script>
<script src="js/wikimedia.js" defer></script>
<script src="js/admin.js" defer></script>
</head>
<body>
<header>
  <h1>Verwaltung · Natur und Schweiz</h1>
  <a href="index.html" target="_blank" rel="noopener">Seite ansehen ↗</a>
  <span id="who" class="hint"></span>
  <button id="logout" class="ghost" hidden>Abmelden</button>
</header>

<div id="loginView" class="panel login" hidden>
  <h2>Anmelden</h2>
  <form id="loginForm">
    <label>E-Mail <input type="email" id="email" required autocomplete="username"></label>
    <label>Passwort <input type="password" id="pw" required autocomplete="current-password"></label>
    <button>Anmelden</button>
  </form>
  <p id="loginMsg" class="hint"></p>
</div>

<div id="mfaView" class="panel login" hidden>
  <h2>Zweiter Faktor</h2>
  <div id="mfaSetup" hidden>
    <p class="hint">Einmalig einrichten: Den QR-Code mit einer Authenticator-App scannen (z. B. Google Authenticator, Microsoft Authenticator oder 1Password).</p>
    <img id="mfaQr" class="qr" alt="QR-Code für die Authenticator-App">
    <p class="hint">Oder den Schlüssel von Hand eingeben: <code id="mfaSecret"></code></p>
  </div>
  <form id="mfaForm">
    <label>6-stelliger Code aus der App <input type="text" id="mfaCode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
    <button>Bestätigen</button>
  </form>
  <p id="mfaMsg" class="hint"></p>
</div>

<div id="appView" class="layout" hidden>
  <aside>
    <button class="ghost" id="toOverview">← Übersicht</button>
    <h2>Kategorien <small id="catCount"></small></h2>
    <ul class="list" id="catList"></ul>
    <button class="ghost" id="newCat">+ Neue Kategorie</button>
  </aside>
  <section class="panel" id="main"></section>
</div>

<div id="msg" hidden></div>

</body>
</html>
