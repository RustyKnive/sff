<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natur und Schweiz</title>
<style>
  :root{
    --bg:#f3f1ea; --card:#ffffff; --ink:#1f2a1f; --muted:#5d6b5c;
    --accent:#2f6b3a; --accent-soft:#e3eee0; --shadow:0 6px 24px rgba(30,50,30,.12);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a15; --card:#1d251e; --ink:#e7eee5; --muted:#a3b3a1;
      --accent:#8fcf94; --accent-soft:#26352a; --shadow:0 6px 24px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  header{max-width:1200px;margin:0 auto;padding:28px 16px 8px}
  header h1{margin:0;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.01em}
  header p{margin:.4rem 0 0;color:var(--muted)}
  .back{display:none;align-items:center;gap:6px;margin-bottom:12px;padding:7px 14px 7px 10px;border:none;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
  .back svg{width:18px;height:18px}
  .back:hover{filter:brightness(.95)}
  body.in-cat .back{display:inline-flex}
  main{max-width:1200px;margin:0 auto;padding:16px 16px 40px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:900px){ main{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:600px){ main{grid-template-columns:1fr} }

  /* Übersicht: Kategorien */
  .cat{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;cursor:pointer;
    background:var(--accent-soft);box-shadow:var(--shadow);border:none;padding:0;text-align:left;color:#fff;font:inherit}
  .cat img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s,transform .5s}
  .cat img.loaded{opacity:1}
  .cat:hover img{transform:scale(1.05)}
  .cat:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .cat .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
  .cat .cap strong{display:block;font-size:1.45rem;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .cat .cap span{font-size:.88rem;opacity:.92}
  .cat .count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);font-size:.75rem;padding:3px 10px;border-radius:99px}

  /* Einträge */
  .card{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;
    background:var(--card);box-shadow:var(--shadow);outline:none}
  .card:focus-visible{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
  .track{display:flex;height:100%;transition:transform .45s cubic-bezier(.4,.1,.2,1)}
  .slide{flex:0 0 100%;height:100%;position:relative;overflow:hidden;background:var(--accent-soft)}
  .slide img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
  .slide img.loaded{opacity:1}
  .status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-align:center;padding:1rem}
  .spinner{width:28px;height:28px;border:3px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .name{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.72));font-weight:700;font-size:1.25rem;
    text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;transition:opacity .3s}
  .card.on-text .name{opacity:0}
  .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;
    padding:3px 9px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none}
  .credit{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;
    padding:3px 8px;border-radius:99px;text-decoration:none;opacity:0;transition:opacity .25s}
  .card:hover .tag,.card:hover .credit,.card:focus-within .tag,.card:focus-within .credit{opacity:1}

  .text{padding:18px 20px 44px;overflow-y:auto;background:var(--card)}
  .text h2{margin:0;font-size:1.3rem;color:var(--accent)}
  .text .sub{margin:0 0 .6rem;color:var(--muted)}
  .text .sub.latin{font-style:italic}
  .text p{margin:0 0 .7rem;font-size:.92rem}
  .text dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:.85rem}
  .text dt{font-weight:600;color:var(--muted)}
  .text dd{margin:0}

  .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
    border:none;background:rgba(255,255,255,.88);color:#1f2a1f;cursor:pointer;display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .25s,transform .2s;z-index:2}
  .nav svg{width:20px;height:20px}
  .nav.prev{left:10px}.nav.next{right:10px}
  .nav:hover{transform:translateY(-50%) scale(1.08)}
  .card:hover .nav,.card:focus-within .nav{opacity:1}
  .dots{position:absolute;bottom:10px;right:14px;display:flex;gap:6px;z-index:2;opacity:0;transition:opacity .25s}
  .card:hover .dots,.card:focus-within .dots{opacity:1}
  .dot{width:9px;height:9px;border-radius:50%;border:none;padding:0;cursor:pointer;background:rgba(255,255,255,.55);
    box-shadow:0 0 2px rgba(0,0,0,.6)}
  .dot.active{background:#fff}
  .dot.txt{border-radius:2px}
  .card.on-text .dot{background:var(--muted);opacity:.45;box-shadow:none}
  .card.on-text .dot.active{background:var(--accent);opacity:1}
  @media (hover:none){ .nav,.dots,.tag,.credit{opacity:1} }

  footer{max-width:1200px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:.8rem}
  footer a{color:inherit}
</style>
<!-- Offline-Bilder (wird vom Offline-Paket mitgeliefert; fehlt die Datei, werden die Bilder online geladen) -->
<script src="bilder/bilder.js"></script>
</head>
<body>
<header>
  <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Übersicht</button>
  <h1 id="title">Natur und Schweiz</h1>
  <p id="intro"></p>
</header>
<main id="grid"></main>
<footer>
  <span id="srcnote">Bilder werden beim Öffnen live von <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> geladen (Internetverbindung nötig).</span> Lizenz und Urheber: Klick auf «Quelle» im jeweiligen Bild.
</footer>

<script>
const OFFLINE = window.OFFLINE_BILDER || null;

/* ------------------------------------------------------------------
   DATEN
   Pro Eintrag: n = Name, s = Untertitel (lateinischer Name / Ort / Gesteinsart),
   t = Beschreibung, f = Steckbrief, q = 3 Suchbegriffe für die Bilder 2–4,
   wp = (optional) Wikipedia-Titel für das Hauptbild, lb = (optional) eigene Bildbeschriftungen
------------------------------------------------------------------- */
const CATS = [
{ id:"baeume", name:"Bäume", desc:"Die wichtigsten Waldbäume", latin:true, cover:3,
  labels:["Baum","Blätter","Früchte","Rinde"],
  items:[
  { n:"Fichte (Rottanne)", s:"Picea abies", lb:["Baum","Nadeln","Zapfen","Rinde"],
    q:["Picea abies needles","Picea abies cones","Picea abies bark"],
    t:"Die Fichte ist mit Abstand der häufigste Baum im Schweizer Wald und liefert fast die Hälfte des Holzvorrats. Ihre spitzen, vierkantigen Nadeln stehen rund um den Zweig. Die Zapfen hängen nach unten und fallen als Ganzes ab. Als Flachwurzler ist sie anfällig für Sturm, Trockenheit und den Borkenkäfer.",
    f:{Höhe:"bis 50 m", Alter:"bis 600 Jahre", Vorkommen:"Voralpen, Alpen, auch Mittelland (oft gepflanzt)", Merkmal:"hängende Zapfen, rötliche Rinde"} },
  { n:"Buche", s:"Fagus sylvatica", lb:["Baum","Blätter","Bucheckern","Rinde"],
    q:["Fagus sylvatica leaves","Fagus sylvatica beechnuts","Fagus sylvatica bark"],
    t:"Die Rotbuche ist der häufigste Laubbaum der Schweiz und würde ohne menschlichen Einfluss grosse Teile des Mittellandes und des Juras bedecken. Typisch sind die glatte, silbergraue Rinde und die eiförmigen Blätter mit leicht gewelltem, bewimpertem Rand. Ihre dreikantigen Früchte heissen Bucheckern.",
    f:{Höhe:"bis 40 m", Alter:"bis 300 Jahre", Vorkommen:"Mittelland, Jura, bis ca. 1500 m", Merkmal:"glatte, silbergraue Rinde"} },
  { n:"Weisstanne", s:"Abies alba", lb:["Baum","Nadeln","Zapfen","Rinde"],
    q:["Abies alba needles","Abies alba cones","Abies alba bark"],
    t:"Die Weisstanne erkennt man an den flachen, stumpfen Nadeln mit zwei weissen Streifen auf der Unterseite. Ihre Zapfen stehen aufrecht auf den Zweigen und zerfallen noch am Baum – am Boden findet man deshalb nie ganze Tannzapfen. Dank ihrer tiefen Pfahlwurzel ist sie sturmfester als die Fichte.",
    f:{Höhe:"bis 50 m", Alter:"bis 600 Jahre", Vorkommen:"Jura, Voralpen, 500–1500 m", Merkmal:"aufrechte Zapfen, weissgraue Rinde"} },
  { n:"Lärche", s:"Larix decidua", lb:["Baum","Nadeln","Zapfen","Rinde"],
    q:["Larix decidua needles","Larix decidua cones","Larix decidua bark"],
    t:"Die Europäische Lärche ist der einzige einheimische Nadelbaum, der im Herbst seine Nadeln abwirft – vorher färbt sie ganze Berghänge goldgelb. Die weichen Nadeln wachsen in Büscheln. Sie liebt Licht und steigt in den Alpen, etwa im Wallis und in Graubünden, bis an die Waldgrenze.",
    f:{Höhe:"bis 45 m", Alter:"bis 1000 Jahre", Vorkommen:"Zentral- und Südalpen, bis 2400 m", Merkmal:"wirft im Herbst die Nadeln ab"} },
  { n:"Waldföhre", s:"Pinus sylvestris", lb:["Baum","Nadeln","Zapfen","Rinde"],
    q:["Pinus sylvestris needles","Pinus sylvestris cone","Pinus sylvestris bark"],
    t:"Die Waldföhre (Waldkiefer) trägt jeweils zwei lange, oft gedrehte Nadeln pro Kurztrieb. Im oberen Stammbereich leuchtet ihre Rinde fuchsrot, unten ist sie grau und tief gefurcht. Als genügsamer Pionierbaum wächst sie auch an sehr trockenen Standorten, zum Beispiel im Wallis.",
    f:{Höhe:"bis 40 m", Alter:"bis 600 Jahre", Vorkommen:"trockene Hänge, Wallis, Jura, Mittelland", Merkmal:"orangerote Rinde im Oberstamm"} },
  { n:"Bergahorn", s:"Acer pseudoplatanus",
    q:["Acer pseudoplatanus leaves","Acer pseudoplatanus fruit samara","Acer pseudoplatanus bark"],
    t:"Der Bergahorn ist der häufigste Ahorn der Schweiz. Seine grossen Blätter sind fünflappig mit stumpfen Buchten. Die Doppel-Flügelfrüchte («Nasenzwicker») stehen etwa im rechten Winkel zueinander und segeln wie Propeller zu Boden. Ältere Bäume haben eine schuppig abblätternde Rinde. Das helle Holz ist im Instrumenten- und Möbelbau beliebt.",
    f:{Höhe:"bis 35 m", Alter:"bis 500 Jahre", Vorkommen:"ganze Schweiz, bis ca. 1800 m", Merkmal:"Flügelfrüchte, schuppige Rinde"} },
  { n:"Esche", s:"Fraxinus excelsior",
    q:["Fraxinus excelsior leaves","Fraxinus excelsior fruit","Fraxinus excelsior bark"],
    t:"Die Gemeine Esche hat unpaarig gefiederte Blätter und auffällige schwarze Knospen. Ihre Früchte sind einseitig geflügelte Nüsschen, die in Büscheln hängen. Das zähe, elastische Holz wird für Werkzeugstiele und Sportgeräte verwendet. Seit etwa 2008 leidet die Esche in der Schweiz stark unter dem Eschentriebsterben, einer Pilzkrankheit.",
    f:{Höhe:"bis 40 m", Alter:"bis 250 Jahre", Vorkommen:"feuchte Böden, Auen, Mittelland", Merkmal:"schwarze Knospen, Fiederblätter"} },
  { n:"Stieleiche", s:"Quercus robur", lb:["Baum","Blätter","Eicheln","Rinde"],
    q:["Quercus robur leaves","Quercus robur acorns","Quercus robur bark"],
    t:"Die Stieleiche – zusammen mit der ähnlichen Traubeneiche die wichtigste Eiche der Schweiz – trägt ihre Eicheln an langen Stielen, während die gebuchteten Blätter fast ungestielt sind. Die dicke Borke ist tief längsrissig. Kaum ein anderer Baum bietet so vielen Insekten- und Vogelarten Lebensraum.",
    f:{Höhe:"bis 40 m", Alter:"bis 1000 Jahre", Vorkommen:"tiefe Lagen, Mittelland, Tessin", Merkmal:"Eicheln an langen Stielen"} },
  { n:"Arve", s:"Pinus cembra", lb:["Baum","Nadeln","Zapfen","Rinde"],
    q:["Pinus cembra needles","Pinus cembra cones","Pinus cembra bark"],
    t:"Die Arve (Zirbelkiefer) gilt als «Königin der Alpen». Sie trägt fünf weiche Nadeln pro Büschel und erträgt extreme Kälte bis zur Waldgrenze. Die Samen, die Arvennüssli, werden vom Tannenhäher versteckt und so verbreitet. Das duftende Holz wird gerne für Arvenstuben und Möbel verwendet.",
    f:{Höhe:"bis 25 m", Alter:"bis 1000 Jahre", Vorkommen:"Engadin, Wallis, 1500–2500 m", Merkmal:"fünf Nadeln pro Büschel"} }
  ]},

{ id:"straeucher", name:"Sträucher", desc:"Häufige Sträucher in Hecken und an Waldrändern", latin:true, cover:4,
  labels:["Strauch","Blätter","Blüten","Früchte"],
  items:[
  { n:"Hasel", s:"Corylus avellana",
    q:["Corylus avellana leaves","Corylus avellana catkins","Corylus avellana nuts"],
    t:"Die Hasel blüht als einer der ersten Sträucher schon im Februar: Die gelben männlichen Kätzchen verstreuen massenhaft Pollen, die winzigen roten weiblichen Blüten sind kaum zu sehen. Im Herbst reifen die Haselnüsse, die bei Eichhörnchen, Haselmaus und Menschen beliebt sind. Die biegsamen Ruten wurden früher für Zäune und Körbe genutzt.",
    f:{Höhe:"2–6 m", Blütezeit:"Februar–März", Früchte:"Haselnüsse (essbar)", Standort:"Waldränder, Hecken"} },
  { n:"Schwarzer Holunder", s:"Sambucus nigra",
    q:["Sambucus nigra leaves","Sambucus nigra flowers","Sambucus nigra berries"],
    t:"Der Schwarze Holunder wächst gerne in der Nähe von Häusern und auf nährstoffreichen Böden. Im Juni trägt er grosse, weisse, duftende Blütendolden, aus denen Sirup gemacht wird. Die schwarzen Beeren sind roh leicht giftig, gekocht aber essbar und werden zu Gelee oder Saft verarbeitet.",
    f:{Höhe:"3–7 m", Blütezeit:"Mai–Juni", Früchte:"schwarze Beeren (nur gekocht essbar)", Standort:"Waldränder, Siedlungen"} },
  { n:"Weissdorn", s:"Crataegus monogyna",
    q:["Crataegus monogyna leaves","Crataegus monogyna flowers","Crataegus monogyna fruit"],
    t:"Der Eingriffelige Weissdorn ist ein dorniger Strauch mit tief gelappten Blättern. Im Mai ist er über und über mit weissen Blüten bedeckt. Seine roten Früchte sind eine wichtige Winternahrung für Vögel, und in seinen dornigen Zweigen brüten viele Heckenvögel geschützt vor Feinden.",
    f:{Höhe:"2–8 m", Blütezeit:"Mai", Früchte:"rote Steinfrüchte", Merkmal:"Dornen, gelappte Blätter"} },
  { n:"Schwarzdorn (Schlehe)", s:"Prunus spinosa",
    q:["Prunus spinosa leaves","Prunus spinosa flowers","Prunus spinosa fruit sloes"],
    t:"Der Schwarzdorn blüht im März und April, noch bevor seine Blätter erscheinen – dann leuchten ganze Hecken weiss. Die blauen, bereiften Früchte (Schlehen) schmecken erst nach dem ersten Frost weniger herb. Mit Dornen und Ausläufern bildet er dichte Gebüsche, in denen zum Beispiel der Neuntöter brütet.",
    f:{Höhe:"1–3 m", Blütezeit:"März–April", Früchte:"blaue Schlehen", Merkmal:"blüht vor dem Blattaustrieb"} },
  { n:"Hundsrose", s:"Rosa canina",
    q:["Rosa canina leaves","Rosa canina flower","Rosa canina hips"],
    t:"Die Hundsrose ist die häufigste Wildrose der Schweiz. Ihre rosa bis weissen Blüten haben fünf Kronblätter. Aus ihnen entstehen die roten Hagebutten, die viel Vitamin C enthalten und zu Tee oder Konfitüre verarbeitet werden. Die behaarten Samen sind als Juckpulver bekannt.",
    f:{Höhe:"1–3 m", Blütezeit:"Juni", Früchte:"Hagebutten", Merkmal:"hakenförmige Stacheln"} },
  { n:"Roter Hartriegel", s:"Cornus sanguinea",
    q:["Cornus sanguinea leaves","Cornus sanguinea flowers","Cornus sanguinea fruit"],
    t:"Der Rote Hartriegel ist an seinen im Winter blutroten Zweigen gut zu erkennen. Die Blätter haben bogig verlaufende Nerven und färben sich im Herbst weinrot. Die weissen Blütendolden werden von Insekten besucht, die schwarzen Beeren von Vögeln gefressen – für Menschen sind sie ungeniessbar.",
    f:{Höhe:"2–5 m", Blütezeit:"Mai–Juni", Früchte:"schwarze Steinfrüchte (ungeniessbar)", Merkmal:"rote Zweige, bogige Blattnerven"} },
  { n:"Liguster", s:"Ligustrum vulgare",
    q:["Ligustrum vulgare leaves","Ligustrum vulgare flowers","Ligustrum vulgare berries"],
    t:"Der Gewöhnliche Liguster ist ein häufiger Strauch in Hecken und an Waldrändern und wird auch gerne als Gartenhecke gepflanzt. Seine weissen Blütenrispen duften stark. Die glänzend schwarzen Beeren bleiben oft bis in den Winter am Strauch und sind für Menschen giftig.",
    f:{Höhe:"2–5 m", Blütezeit:"Juni–Juli", Früchte:"schwarze Beeren (giftig)", Merkmal:"Blätter oft bis in den Winter grün"} },
  { n:"Pfaffenhütchen", s:"Euonymus europaeus",
    q:["Euonymus europaeus leaves","Euonymus europaeus flowers","Euonymus europaeus fruit"],
    t:"Das Pfaffenhütchen verdankt seinen Namen den leuchtend rosaroten Früchten, die an die Kopfbedeckung eines Priesters erinnern. Beim Aufplatzen zeigen sie orange umhüllte Samen. Alle Teile der Pflanze sind stark giftig. Die grünen Zweige tragen oft vier Korkleisten.",
    f:{Höhe:"2–6 m", Blütezeit:"Mai–Juni", Früchte:"rosarote Kapseln (giftig)", Merkmal:"vierkantige Zweige"} },
  { n:"Wolliger Schneeball", s:"Viburnum lantana",
    q:["Viburnum lantana leaves","Viburnum lantana flowers","Viburnum lantana fruit"],
    t:"Der Wollige Schneeball wächst an trockenen, kalkreichen Waldrändern, etwa im Jura. Blätter und junge Zweige sind filzig behaart. Die Früchte färben sich von Grün über Rot nach Schwarz, sodass oft alle Farben gleichzeitig an einem Fruchtstand zu sehen sind.",
    f:{Höhe:"1–4 m", Blütezeit:"April–Juni", Früchte:"erst rot, dann schwarz (giftig)", Merkmal:"filzige Blätter"} }
  ]},

{ id:"alpenblumen", name:"Alpenblumen", desc:"Blütenpracht über der Waldgrenze", latin:true, cover:0,
  labels:["Pflanze","Blüte","Blätter","Lebensraum"],
  items:[
  { n:"Edelweiss", s:"Leontopodium nivale subsp. alpinum", wp:"Edelweiss",
    q:["Leontopodium alpinum flower close-up","Leontopodium alpinum leaves","Leontopodium alpinum rock"],
    t:"Das Edelweiss ist das bekannteste Symbol der Alpen. Die weissen «Blütensterne» sind eigentlich filzig behaarte Hochblätter; die eigentlichen Blüten sitzen als kleine gelbe Köpfchen in der Mitte. Der dichte Haarfilz schützt vor Austrocknung und starker UV-Strahlung.",
    f:{Blütezeit:"Juli–September", Höhenlage:"1800–3000 m", Standort:"Kalkfelsen, steinige Rasen", Schutz:"in vielen Kantonen geschützt"} },
  { n:"Stängelloser Enzian", s:"Gentiana acaulis",
    q:["Gentiana acaulis flower","Gentiana acaulis leaves","Gentiana acaulis meadow"],
    t:"Der Stängellose Enzian trägt eine grosse, tiefblaue Glockenblüte, die fast direkt aus der Blattrosette wächst. Bei schlechtem Wetter schliesst sich die Blüte. Er wächst auf sauren, kalkarmen Böden; auf Kalk ersetzt ihn der sehr ähnliche Clusius-Enzian.",
    f:{Blütezeit:"Mai–August", Höhenlage:"1200–3000 m", Standort:"Alpweiden, saure Böden", Merkmal:"grosse blaue Glocke"} },
  { n:"Frühlings-Enzian", s:"Gentiana verna",
    q:["Gentiana verna flower","Gentiana verna leaves","Gentiana verna meadow"],
    t:"Der Frühlings-Enzian bildet kleine, leuchtend azurblaue Sternblüten mit fünf Zipfeln. Er gehört zu den ersten Blumen, die nach der Schneeschmelze blühen. Seine Blüten öffnen sich nur bei Sonnenschein.",
    f:{Blütezeit:"März–Juli (je nach Höhe)", Höhenlage:"500–2600 m", Standort:"magere Rasen", Merkmal:"kleine blaue Sternblüte"} },
  { n:"Alpenrose", s:"Rhododendron ferrugineum",
    q:["Rhododendron ferrugineum flowers","Rhododendron ferrugineum leaves","Rhododendron ferrugineum slope"],
    t:"Die Rostblättrige Alpenrose ist ein immergrüner Zwergstrauch, der im Sommer ganze Hänge rosarot färbt. Die Blattunterseite ist rostbraun gefärbt – daher der Name. Sie wächst auf sauren Böden und ist wie alle Rhododendren giftig.",
    f:{Blütezeit:"Juni–August", Höhenlage:"1500–2500 m", Standort:"Zwergstrauchheiden", Merkmal:"rostbraune Blattunterseite"} },
  { n:"Türkenbund", s:"Lilium martagon",
    q:["Lilium martagon flower","Lilium martagon leaves","Lilium martagon meadow"],
    t:"Die Türkenbund-Lilie hat nickende, rosa-violette Blüten mit dunklen Flecken, deren Blütenblätter stark zurückgebogen sind – wie ein Turban. Abends duftet sie stark und lockt Nachtfalter an. Sie wächst in lichten Bergwäldern und Hochstaudenfluren.",
    f:{Blütezeit:"Juni–August", Höhenlage:"bis 2300 m", Standort:"lichte Bergwälder", Schutz:"vielerorts geschützt"} },
  { n:"Silberwurz", s:"Dryas octopetala",
    q:["Dryas octopetala flower","Dryas octopetala leaves","Dryas octopetala seed heads"],
    t:"Die Silberwurz ist ein kriechender Zwergstrauch mit weissen Blüten, die meist acht Kronblätter haben. Nach der Blüte entstehen fedrige, silbrig glänzende Fruchtstände. Mit ihren dichten Teppichen festigt sie Schutthänge auf Kalk.",
    f:{Blütezeit:"Juni–August", Höhenlage:"1200–2500 m", Standort:"Kalkschutt, Felsen", Merkmal:"acht weisse Kronblätter"} },
  { n:"Trollblume", s:"Trollius europaeus",
    q:["Trollius europaeus flower","Trollius europaeus leaves","Trollius europaeus meadow"],

/* ------------------------------------------------------------------
   BILDER (Wikipedia / Wikimedia Commons, live geladen)
------------------------------------------------------------------- */
const API_WP = "https://en.wikipedia.org/w/api.php";
const API_C  = "https://commons.wikimedia.org/w/api.php";
const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Wikimedia bremst zu viele gleichzeitige Anfragen (Fehler 429).
   Darum: wenige Anfragen gleichzeitig, bei Fehlern warten und erneut versuchen. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function limiter(n){
  let active = 0; const queue = [];
  const next = () => {
    if(active >= n || !queue.length) return;
    active++;
    const { fn, res, rej } = queue.shift();
    fn().then(res, rej).finally(() => { active--; next(); });
  };
  return fn => new Promise((res, rej) => { queue.push({ fn, res, rej }); next(); });
}
const apiQueue = limiter(3);   // gleichzeitige Suchanfragen
const imgQueue = limiter(4);   // gleichzeitige Bild-Downloads

async function retry(fn, tries = 5){
  let wait = 1500;
  for(let i = 0; ; i++){
    try{ return await fn(i); }
    catch(e){
      if(e.fatal || i >= tries - 1) throw e;
      await sleep(e.retryAfter || wait);
      wait *= 2;
    }
  }
}
function httpError(r){
  const e = new Error("HTTP " + r.status);
  e.fatal = !(r.status === 429 || r.status >= 500);
  const ra = parseInt(r.headers.get("Retry-After"), 10);
  if(ra) e.retryAfter = Math.min(ra, 60) * 1000;
  return e;
}

function getJSON(url){
  return apiQueue(() => retry(async () => {
    const r = await fetch(url);
    if(!r.ok) throw httpError(r);
    return r.json();
  }));
}

// Titelbild des Wikipedia-Artikels
async function wikiImage(title){
  const u = API_WP + "?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=960&titles=" + encodeURIComponent(title);
  const d = await getJSON(u);
  const p = Object.values(d.query.pages)[0];
  if(!p.thumbnail) throw new Error("kein Titelbild");
  return { src:p.thumbnail.source, page:"https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(p.pageimage), file:p.pageimage };
}

// Suche auf Wikimedia Commons – mit immer allgemeineren Ersatz-Suchbegriffen
const OK_MIME = ["image/jpeg", "image/png"];
async function commonsSearch(query, used){
  const u = API_C + "?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20&gsrsearch="
    + encodeURIComponent(query + " filetype:bitmap") + "&prop=imageinfo&iiprop=url|mime&iiurlwidth=960";
  const d = await getJSON(u);
  const pages = Object.values((d.query && d.query.pages) || {}).sort((a,b) => a.index - b.index);
  for(const p of pages){
    const ii = p.imageinfo && p.imageinfo[0];
    if(!ii || !OK_MIME.includes(ii.mime)) continue;
    const file = p.title.replace(/^File:/, "");
    if(used.has(file)) continue;
    used.add(file);
    return { src:ii.thumburl || ii.url, page:ii.descriptionurl, file };
  }
  return null;
}
async function commonsImage(query, used, base){
  const words = query.split(" ");
  const tries = [query];
  for(let n = words.length - 1; n >= 2; n--) tries.push(words.slice(0, n).join(" "));
  if(base && !tries.includes(base)) tries.push(base);
  for(const q of tries){
    const img = await commonsSearch(q, used);
    if(img) return img;
  }
  throw new Error("nichts gefunden");
}

// Hauptbild eines Eintrags (zwischengespeichert, auch für die Übersicht verwendet)
const baseName = (cat, item) => item.wp || (cat.latin ? item.s : item.n);
const mainCache = new Map();
function mainImage(cat, item){
  const key = baseName(cat, item);
  if(!mainCache.has(key)){
    mainCache.set(key, wikiImage(key).catch(() => commonsImage(key, new Set())));
  }
  return mainCache.get(key);
}

// Dateiname-taugliche Kurzform
const slug = s => s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const imgKey = (cat, item, k) => `${cat.id}/${slug(item.n)}-${k + 1}`;

// Lokales Bild aus dem Offline-Paket (falls vorhanden)
function localImage(cat, item, k){
  const key = imgKey(cat, item, k);
  const o = OFFLINE && OFFLINE[key];
  return o ? { src:"bilder/" + key + ".jpg", page:o.page, file:o.file } : null;
}

// Die 4 Online-Bilder eines Eintrags ermitteln (zwischengespeichert)
const itemCache = new Map();
function resolveItem(cat, item){
  const key = cat.id + "/" + slug(item.n);
  if(itemCache.has(key)) return itemCache.get(key);
  const used = new Set();
  const base = baseName(cat, item);
  const main = mainImage(cat, item).then(img => { used.add(img.file); return img; });
  const res = [main];
  let chain = main.catch(() => null);
  item.q.forEach(q => {
    const p = chain.then(() => commonsImage(q, used, base));
    res.push(p);
    chain = p.catch(() => null);
  });
  itemCache.set(key, res);
  return res;
}

// Ein Bild laden (mit Warteschlange und Wiederholung)
function preload(src){
  return imgQueue(() => retry(() => new Promise((res, rej) => {
    const t = new Image();
    t.onload = () => res();
    t.onerror = () => rej(new Error("Bildfehler"));
    t.src = src;
  }), 4));
}
function showImg(img, data){
  return preload(data.src).then(() => {
    img.src = data.src;
    img.classList.add("loaded");
  });
}

// Bild für einen Platz: zuerst lokal, sonst (oder wenn die lokale Datei fehlt) online
function fillSlide(slide, cat, item, k){
  const status = slide.querySelector(".status");
  const el = slide.querySelector("img");
  const a = slide.querySelector(".credit");
  el.alt = slide.dataset.alt;
  const show = data => showImg(el, data).then(() => {
    status.remove(); a.href = data.page; a.hidden = false;
  });
  const online = () => resolveItem(cat, item)[k].then(show);
  const loc = localImage(cat, item, k);
  (loc ? show(loc).catch(online) : online())
    .catch(() => { status.textContent = "Bild nicht verfügbar"; });
}
function imageFor(cat, item, k){
  const loc = localImage(cat, item, k);
  return loc ? Promise.resolve(loc) : resolveItem(cat, item)[k];
}

/* ------------------------------------------------------------------
   KARTE EINES EINTRAGS (4 Bilder + Text)
------------------------------------------------------------------- */
function buildCard(cat, item){
  const labels = item.lb || cat.labels;
  const card = document.createElement("article");
  card.className = "card";
  card.tabIndex = 0;
  card.setAttribute("aria-label", item.n);

  const imgSlides = labels.map(l => `
    <div class="slide" data-alt="${esc(item.n + " – " + l)}">
      <img alt="">
      <div class="status"><div class="spinner"></div></div>
      <span class="tag">${esc(l)}</span>
      <a class="credit" target="_blank" rel="noopener" hidden>Quelle</a>
    </div>`).join("");
  const facts = Object.entries(item.f).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");

  card.innerHTML = `
    <div class="track">
      ${imgSlides}
      <div class="slide text">
        <h2>${esc(item.n)}</h2>
        <p class="sub${cat.latin ? " latin" : ""}">${esc(item.s)}</p>
        <p>${esc(item.t)}</p>
        <dl>${facts}</dl>
      </div>
    </div>
    <div class="name">${esc(item.n)}</div>
    <button class="nav prev" aria-label="Zurück">${ARROW_L}</button>
    <button class="nav next" aria-label="Weiter">${ARROW_R}</button>
    <div class="dots">
      ${labels.map((l,k)=>`<button class="dot" aria-label="${esc(l)}" data-i="${k}"></button>`).join("")}
      <button class="dot txt" aria-label="Beschreibung" data-i="4"></button>
    </div>`;

  const track = card.querySelector(".track");
  const dots = [...card.querySelectorAll(".dot")];
  const N = 5;
  let cur = 0;
  const go = n => {
    cur = (n + N) % N;
    track.style.transform = `translateX(-${cur * 100}%)`;
    dots.forEach((d, k) => d.classList.toggle("active", k === cur));
    card.classList.toggle("on-text", cur === 4);
  };
  card.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); go(cur - 1); });
  card.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); go(cur + 1); });
  dots.forEach(d => d.addEventListener("click", () => go(+d.dataset.i)));
  card.addEventListener("keydown", e => {
    if(e.key === "ArrowRight"){ go(cur + 1); e.preventDefault(); }
    if(e.key === "ArrowLeft"){ go(cur - 1); e.preventDefault(); }
  });
  go(0);

  // Hauptbild sofort laden, die weiteren Bilder erst beim ersten Darüberfahren
  const slides = card.querySelectorAll(".slide:not(.text)");
  fillSlide(slides[0], cat, item, 0);
  let rest = false;
  const loadRest = () => { if(rest) return; rest = true; for(let k = 1; k < slides.length; k++) fillSlide(slides[k], cat, item, k); };
  card.addEventListener("mouseenter", loadRest);
  card.addEventListener("focusin", loadRest);
  card.addEventListener("touchstart", loadRest, { passive:true });
  return card;
}

/* ------------------------------------------------------------------
   ANSICHTEN: Übersicht und Kategorie
------------------------------------------------------------------- */
const grid = document.getElementById("grid");
const titleEl = document.getElementById("title");
const introEl = document.getElementById("intro");
const catCards = new Map();   // bereits gebaute Karten pro Kategorie (Bilder werden nur einmal geladen)
let overviewCards = null;

function buildOverview(){
  return CATS.map(cat => {
    const b = document.createElement("button");
    b.className = "cat";
    b.innerHTML = `<img alt=""><div class="status"><div class="spinner"></div></div>
      <span class="count">9 Einträge</span>
      <div class="cap"><strong>${esc(cat.name)}</strong><span>${esc(cat.desc)}</span></div>`;
    b.addEventListener("click", () => { location.hash = "#/" + cat.id; });
    const img = b.querySelector("img");
    const status = b.querySelector(".status");
    img.alt = cat.name;
    const item = cat.items[cat.cover];
    const online = () => resolveItem(cat, item)[0].then(d => showImg(img, d));
    const loc = localImage(cat, item, 0);
    (loc ? showImg(img, loc).catch(online) : online()).finally(() => status.remove());
    return b;
  });
}

function render(){
  const id = location.hash.replace(/^#\/?/, "");
  const cat = CATS.find(c => c.id === id);
  grid.replaceChildren();
  window.scrollTo(0, 0);
  if(!cat){
    document.body.classList.remove("in-cat");
    titleEl.textContent = "Natur und Schweiz";
    introEl.textContent = "Wähle eine Kategorie.";
    document.title = "Natur und Schweiz";
    if(!overviewCards) overviewCards = buildOverview();
    grid.append(...overviewCards);
    return;
  }
  document.body.classList.add("in-cat");
  titleEl.textContent = cat.name;
  introEl.textContent = "Mit der Maus auf ein Bild fahren und mit den Pfeilen durch die Bilder und den Steckbrief blättern.";
  document.title = cat.name + " – Natur und Schweiz";
  if(!catCards.has(cat.id)) catCards.set(cat.id, cat.items.map(it => buildCard(cat, it)));
  grid.append(...catCards.get(cat.id));
}


if(OFFLINE){
  document.getElementById("srcnote").textContent = "Offline-Version: Die Bilder stammen von Wikimedia Commons und liegen im Ordner «bilder».";
}

document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
window.addEventListener("hashchange", render);
render();
