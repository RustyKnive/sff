<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kantonszeichen Zürich für «Natur und Schweiz»: eigene, vereinfachte Zeichnung nach den Farben des Wappens
       (schräg geteilt von Weiss und Blau). Kein offizielles Wappen. -->
  <defs><clipPath id="c"><circle cx="32" cy="32" r="31"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="#ffffff"/>
    <path d="M0 0 L64 64 L0 64 Z" fill="#0f5fa8"/>
  </g>
  <circle cx="32" cy="32" r="30.2" fill="none" stroke="#0f5fa8" stroke-width="1.6"/>
</svg>
